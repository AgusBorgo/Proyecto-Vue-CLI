<section class="card">
    <div class="card-hearder">
        <h3>Componente Formulario</h3>
    </div>

   <div class="card-body">
  <form novalidate @submit.prevent="enviar">
    <!-- Campo nombre -->
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        class="form-control"
        v-model.trim="formData.nombre"
        @input="formDirty.nombre = true"
      />
      <div v-if="errorNombre.mostrar" class="alert alert-danger mt-2">
        {{errorNombre.mensaje}}
      </div>
    </div>

    <!-- Campo apellido -->
    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input
        type="text"
        id="apellido"
        class="form-control"
        v-model.trim="formData.apellido"
        @input="formDirty.apellido = true"
      />
      <div v-if="errorApellido.mostrar" class="alert alert-danger mt-2">
        {{errorApellido.mensaje}}
      </div>
    </div>

    <!-- Campo edad -->
    <div class="form-group">
      <label for="edad">Edad</label>
      <input
        type="number"
        id="edad"
        class="form-control"
        v-model.number="formData.edad"
        @input="formDirty.edad = true"

      />
      <div v-if="errorEdad.mostrar" class="alert alert-danger mt-2">
        {{errorEdad.mensaje}}
      </div>
    </div>

    <button type="submit" class="btn btn-success my-3" :disabled="estadoBotonDesabilitado">Enviar</button>
  </form>

  <br>
  <p><u>formData</u></p>
  <pre><p>{{formData}}</p></pre>


  <p><u>formDirty</u></p>
  <pre><p>{{formDirty}}</p></pre>

</div>

  </section>
