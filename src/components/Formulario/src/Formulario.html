<section class="card">
    <div class="card-hearder">
        <h3>Componente Formulario</h3>
    </div>

   <div class="card-body">
  <form novalidate @submit.prevent="enviar">
    <!-- Campo nombre -->
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        class="form-control"
        v-model.trim="formData.nombre"
      />
    </div>

    <!-- Campo apellido -->
    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input
        type="text"
        id="apellido"
        class="form-control"
        v-model.trim="formData.apellido"
      />
    </div>

    <!-- Campo edad -->
    <div class="form-group">
      <label for="edad">Edad</label>
      <input
        type="number"
        id="edad"
        class="form-control"
        v-model.number="formData.edad"
      />
    </div>

    <button type="submit" class="btn btn-success my-3" :diseable="true">Enviar</button>
  </form>
</div>

  </section>
